<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
 
<button
		class="tarantino-boton"
		type="button"
		aria-label="Mostrar las 12 fotos y reproducir audio de Tarantino"
		aria-expanded="false"
		aria-controls="galeria-fotos">
		<img src="assets/titulo.png" alt="Written and Directed by Quentin Tarantino">
		<span> Haz click para Descubrir las fotos y Desliza</span>
	</button>

	
	<p class="estado-audio" aria-live="polite"></p>

	

		<div class="galeria-fotos" id="galeria-fotos" hidden>
			<img src="assets/p20.1.jpg" data-gif="assets/p20.gif" alt="Escena 20">
			<img src="assets/p19.jpg" data-gif="assets/p19.1.gif" alt="Escena 19">
			
			<img src="assets/p18.jpg" data-gif="assets/p18.1.gif" alt="Escena 3">
			<img src="assets/p17.jpg" data-gif="assets/p17.1.webp" alt="Escena 4">
			<img src="assets/p16.jpg" data-gif="assets/p16.1.webp" alt="Escena 5">
			<img src="assets/p15.jpg" data-gif="assets/p15.1.gif" alt="Escena 6">
			<img src="assets/p14.jpg" data-gif="assets/p14.1.gif" alt="Escena 7">
			<img src="assets/p13.jpg" data-gif="assets/p13.1.webp" alt="Escena 8">
			<img src="assets/p12.jpg" data-gif="assets/p12.1.gif" alt="Escena 9">
			<img src="assets/p10.jpg" data-gif="assets/p10.1.gif" alt="Escena 10">
			<img src="assets/p11.jpg" data-gif="assets/p11.1.gif" alt="Escena 11">
			<img src="assets/p9.jpg" data-gif="assets/p9.1.gif" alt="Escena 12">
			<img src="assets/p8.jpg" data-gif="assets/p8.1.gif" alt="Escena 13">
			<img src="assets/p7.jpg" data-gif="assets/p7.1.gif" alt="Escena 14">
			<img src="assets/p6.jpg" data-gif="assets/p6.1.gif" alt="Escena 15">
			<img src="assets/p5.jpg" data-gif="assets/p5.1.gif" alt="Escena 16">
			<img src="assets/p4.jpg" data-gif="assets/p4.1.gif" alt="Escena 17">
			<img src="assets/p3.jpg" data-gif="assets/p3.1.gif" alt="Escena 18">
			<img src="assets/p2.jpg" data-gif="assets/p2.1.gif" alt="Escena 19">
			<img src="assets/p1.jpg" data-gif="assets/p1.1.gif" alt="Escena 20">

			
		</div>
	</main>
 
	


		
		
	</div>
</main>


<audio id="tarantino-audio" src="song/Nancy Sinatra - BanG bANg  - Subtítulos Inglés - Español.mp3" preload="none"></audio>


<script>
	const tarantinoButton = document.querySelector(".tarantino-boton");
	const photoGallery = document.querySelector("#galeria-fotos");
	const tarantinoAudio = document.querySelector("#tarantino-audio");
	const audioStatus = document.querySelector(".estado-audio");

	tarantinoButton.addEventListener("click", () => {
		photoGallery.hidden = false;
		photoGallery.classList.add("visible");
		tarantinoButton.setAttribute("aria-expanded", "true");
		tarantinoAudio.currentTime = 0;
		tarantinoAudio.play()
			.then(() => {
				audioStatus.textContent = "Reproduciendo banda sonora de Tarantino";
			})
			.catch((error) => {
				audioStatus.textContent = "No se pudo reproducir el audio. Inténtalo de nuevo.";
				console.error("No se pudo reproducir el audio:", error);
			});
	});
</script>
<script src="tarantino.js"></script>
</body>
