<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>..:: Bestiario Tarantino ::..</title>


    
    <meta property="og:locale" content="es_CO" />
    <meta property="og:type" content="website" />
    
    <link rel="stylesheet" href="estilo.css" />

   
    <script src="script.js" defer></script>
  </head>
  <body>
    
      
   
    <div id="contenedorGeneral">
      <h1 id="tituloPagina">
         <h1 id="tituloPagina">CHOOSE A MOVIE</h1>
        >
      </h1>

      <div id="escenario">
      
        <div id="contenedorPersonaje">
          <img class="imagen" id="top" src="" alt="Top del personaje" />
          <img class="imagen" id="torso" src="" alt="Torso del personaje" />
          <img class="imagen" id="abajo" src="" alt="Parte de abajo del personaje" />
        </div>

        <!-- Cuadro 2: el póster de película -->
        <div id="contenedorPoster">
          <img id="poster" src="" alt="Póster de película de Tarantino" />
        </div>
      </div>

   <button id="boton">Mezclar</button>
    <audio id="musica" src="song/Pulp Fiction Misirlou - Music & Movie Moments – Christiaan Janssens.mp3" loop autoplay preload="auto"></audio>
  </div>

  <script>
    document.getElementById("boton").addEventListener("click", () => {
      const musica = document.getElementById("musica");
      if (musica.paused) {
        musica.play();
      }
    });
  </script>
   <script>
    let intentos = 0;

    document.getElementById("boton").addEventListener("click", () => {
      intentos++;

      setTimeout(() => {
        const imgTop = document.getElementById("top");
        const imgTorso = document.getElementById("torso");
        const imgAbajo = document.getElementById("abajo");
        const imgPoster = document.getElementById("poster");

        // Sale entre el clic 3 y el 6 con 35% de probabilidad
        if (intentos >= 12 || (intentos >= 3 && Math.random() < 0.35)) {
          imgTop.src = "assets/top2.jpg";
          imgTorso.src = "assets/torsok.jpg";
          imgAbajo.src = "assets/abajok.jpg";
          imgPoster.src = "assets/posterk.jpg";
        }

        const top = decodeURIComponent(imgTop.getAttribute("src") || "").toLowerCase();
        const torso = decodeURIComponent(imgTorso.getAttribute("src") || "").toLowerCase();
        const abajo = decodeURIComponent(imgAbajo.getAttribute("src") || "").toLowerCase();
        const poster = decodeURIComponent(imgPoster.getAttribute("src") || "").toLowerCase();

        // COMBO ÚNICO: Kill Bill (K) -> lleva a bio.html
        const esComboKillBill =
          top.includes("top2.jpg") &&
          torso.includes("torsok.jpg") &&
          abajo.includes("abajok.jpg") &&
          poster.includes("posterk.jpg");

        if (esComboKillBill) {
          setTimeout(() => {
            window.location.href = "bio.html";
          }, 1000);
        }
      }, 50);
    });
  </script>
</body>
</html>
